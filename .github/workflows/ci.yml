name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Prove the toolkit runs on a bare standard library (no optional deps),
  # across supported Python versions and on Windows for one version.
  stdlib:
    name: stdlib-only (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (no optional dependencies)
        run: python -m unittest discover -s skills/seo-scan/tests -v
      - name: Check release version consistency
        run: python scripts/sync_version.py --check

  # Prove dynamic version metadata survives sdist -> wheel -> installed runtime.
  packaging:
    name: installed package version contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Verify installed version surfaces
        run: |
          pip install --no-deps dist/*.whl
          narwhal --version
          python -c 'from importlib.metadata import version; import narwhal, narwhal.cli; from narwhal.lib.report import TOOL_VERSION; assert version("narwhal-seo") == narwhal.__version__ == narwhal.cli.__version__ == TOOL_VERSION'

  # Prove it also works with the optional parsing/rendering extras installed.
  with-extras:
    name: with-extras (py3.12, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional extras
        run: pip install -r skills/seo-scan/requirements.txt
      - name: Run tests (with extras)
        run: python -m unittest discover -s skills/seo-scan/tests -v

  # The SDK renamed FastMCP in 2.0. Exercise both supported high-level APIs so
  # optional MCP installs cannot drift into a server-startup failure unnoticed.
  mcp-contract:
    name: MCP SDK ${{ matrix.mcp-version }} contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp-version: ["1.29.0", "2.0.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP SDK
        run: pip install "mcp==${{ matrix.mcp-version }}"
      - name: Run MCP and planner contract tests
        run: python -m unittest discover -s skills/seo-scan/tests -v

  # Prove the --render (Playwright) path actually executes JavaScript end to end.
  render-smoke:
    name: render-smoke (playwright chromium, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional PDF/browser engines
        run: |
          pip install playwright weasyprint
          python -m playwright install --with-deps chromium
      - name: Render smoke test
        run: python skills/seo-scan/tests/render_smoke.py
      - name: Branded report table browser regression
        run: python skills/seo-scan/tests/report_table_smoke.py
      - name: Literal crawl table browser regression
        run: python skills/seo-scan/tests/crawl_table_smoke.py
      - name: Findings-first page headline browser regression
        run: python skills/seo-scan/tests/report_headline_smoke.py
      - name: Literal attribution-cue browser regression
        run: python skills/seo-scan/tests/attribution_cue_smoke.py
      - name: Native score-table mobile browser regression
        run: python skills/seo-scan/tests/native_score_table_smoke.py
      - name: Same-run rendered review capture
        run: python skills/seo-scan/tests/review_capture_smoke.py
      - name: Literal quick-win preview browser regression
        run: python skills/seo-scan/tests/quick_win_preview_smoke.py
      - name: Scoped content-length browser regression
        run: python skills/seo-scan/tests/content_length_smoke.py
      - name: Neutral comparative-length browser regression
        run: python skills/seo-scan/tests/comparative_length_smoke.py
      - name: Neutral evidence-cue browser regression
        run: python skills/seo-scan/tests/comparative_evidence_smoke.py
      - name: Exact question-cue browser regression
        run: python skills/seo-scan/tests/question_observation_smoke.py
      - name: Dated schema-appearance browser regression
        run: python skills/seo-scan/tests/schema_appearance_smoke.py
      - name: Schema-extraction coverage browser regression
        run: python skills/seo-scan/tests/schema_coverage_smoke.py
      - name: Compared-heading review browser regression
        run: python skills/seo-scan/tests/subtopic_observation_smoke.py
      - name: Page-schema advice and remediation browser regression
        run: python skills/seo-scan/tests/page_schema_review_smoke.py
      - name: JSON-LD syntax and processing browser regression
        run: python skills/seo-scan/tests/jsonld_error_stages_smoke.py
      - name: Paired rendered-text evidence browser regression
        run: python skills/seo-scan/tests/rendered_text_evidence_smoke.py
      - name: Scoped date-cue browser regression
        run: python skills/seo-scan/tests/date_cues_smoke.py
      - name: Scoped readability-formula browser regression
        run: python skills/seo-scan/tests/readability_observation_smoke.py
      - name: Native measurement disclosure browser regression
        run: python skills/seo-scan/tests/measurement_disclosure_smoke.py
      - name: Scoped lexical-focus browser regression
        run: python skills/seo-scan/tests/lexical_focus_smoke.py
      - name: Branded page/audit/Markdown geometry in both PDF engines
        run: python skills/seo-scan/tests/brand_layout_smoke.py
