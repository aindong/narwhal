name: Mutation testing

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Link classification mutations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development tools
        run: python -m pip install -r requirements-mutation.txt
      - name: Require every selected mutant to be killed
        run: python scripts/mutation_test.py --report mutation-default.json
      - name: Require every execution-scope validator mutant to be killed
        run: >-
          python scripts/mutation_test.py --config scripts/mutation/scope.toml --report mutation-scope.json
          'lib.report.x_recorded_scan_scope__mutmut_*'
      - name: Require every crawl-count validator mutant to be killed
        run: >-
          python scripts/mutation_test.py --config scripts/mutation/diff.toml --report mutation-count.json
          'diff_scan.x__crawl_count_problem__mutmut_*'
      - name: Retain mutation result receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: |
            mutation-default.json
            mutation-scope.json
            mutation-count.json
