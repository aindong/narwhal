# Opt-in llms.txt receipts and generator checks; pass explicit function targets.
[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/lib/llms_resource.py", "src/lib/report.py", "src/generate_llms.py"]
also_copy = ["skills/seo-scan/tests/"]
pytest_add_cli_args_test_selection = [
  "skills/seo-scan/tests/test_llms_resource.py",
  "skills/seo-scan/tests/test_resource_range_coverage.py",
  "skills/seo-scan/tests/test_llms_metadata_coverage.py",
  "skills/seo-scan/tests/test_llms_literal_markdown.py",
  "skills/seo-scan/tests/test_llms_redirect_context.py",
  "skills/seo-scan/tests/test_llms_budgets.py",
  "skills/seo-scan/tests/test_llms_artifact_userinfo.py",
]
[tool.pytest.ini_options]
pythonpath = ["skills/seo-scan/tests"]
