# Opt-in Product/Offer comparison coverage; select changed functions explicitly.
[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/lib/report.py", "src/crawl_site.py", "src/audit.py", "src/diff_scan.py", "src/plan.py"]
also_copy = ["skills/seo-scan/tests/"]
pytest_add_cli_args_test_selection = [
  "skills/seo-scan/tests/test_merchant_comparison_coverage.py",
  "skills/seo-scan/tests/test_merchant_identity.py",
  "skills/seo-scan/tests/test_offer_comparisons.py",
  "skills/seo-scan/tests/test_scan_scope.py",
  "skills/seo-scan/tests/test_scope_selection_consistency.py",
  "skills/seo-scan/tests/test_diff_scope.py",
  "skills/seo-scan/tests/test_diff_crawl_coverage.py",
  "skills/seo-scan/tests/test_plan.py",
  "-k", "not test_published_json_schema_matches_contract_version_and_required_fields",
]
[tool.pytest.ini_options]
pythonpath = ["skills/seo-scan/tests"]
