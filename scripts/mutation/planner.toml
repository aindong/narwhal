# Opt-in planner/crawl-witness profile; pass explicit changed-function patterns.
# Published schema-file checks stay in the full suite; references are not staged.
[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/plan.py", "src/lib/finding_urls.py", "src/crawl_site.py"]
also_copy = ["skills/seo-scan/tests/"]
pytest_add_cli_args_test_selection = [
 "skills/seo-scan/tests/test_plan_group_safety.py",
 "skills/seo-scan/tests/test_plan_group_overlaps.py",
 "skills/seo-scan/tests/test_plan_label_previews.py",
 "skills/seo-scan/tests/test_report_duplicate_keys.py",
 "skills/seo-scan/tests/test_plan_manifest.py",
 "skills/seo-scan/tests/test_plan_read_budget.py",
 "skills/seo-scan/tests/test_plan_input_validation.py",
 "skills/seo-scan/tests/test_plan_output_safety.py",
 "skills/seo-scan/tests/test_plan_local_pairs.py",
 "skills/seo-scan/tests/test_plan_scan_settings.py",
 "skills/seo-scan/tests/test_plan_baseline_preservation.py",
 "skills/seo-scan/tests/test_plan_command_quoting.py",
 "skills/seo-scan/tests/test_plan_verification_kind.py",
 "skills/seo-scan/tests/test_plan_markdown_verification.py",
 "skills/seo-scan/tests/test_plan_next_page_routes.py",
 "skills/seo-scan/tests/test_plan_next_discovery_owners.py",
 "skills/seo-scan/tests/test_plan_owner_contract.py",
 "skills/seo-scan/tests/test_plan_owner_preview.py",
 "skills/seo-scan/tests/test_plan_literal_paths.py",
 "skills/seo-scan/tests/test_plan_automation_eligibility.py::TestAutomationEligibility::test_markdown_receipts_expose_classification_blockers_and_authority_limits",
 "skills/seo-scan/tests/test_plan_automation_eligibility.py::TestAutomationEligibility::test_markdown_without_observed_owners_withholds_convention_and_ownerless_actions",
 "skills/seo-scan/tests/test_plan_automation_eligibility.py::TestAutomationEligibility::test_explicit_invalid_scope_blocks_page_and_crawl_without_repairing_legacy",
 "skills/seo-scan/tests/test_plan_automation_eligibility.py::TestAutomationEligibility::test_known_partial_truncated_failed_or_unexecuted_source_withholds_automation",
 "skills/seo-scan/tests/test_plan_automation_eligibility.py::TestAutomationEligibility::test_completed_technical_check_does_not_require_unrelated_auditors",
 "skills/seo-scan/tests/test_plan_automation_eligibility.py::TestAutomationEligibility::test_explicit_unusable_execution_evidence_withholds_automation",
 "skills/seo-scan/tests/test_plan_automation_eligibility.py::TestAutomationEligibility::test_absent_legacy_status_flags_and_valid_success_remain_candidates",
 "skills/seo-scan/tests/test_plan_inventory_errors.py",
 "skills/seo-scan/tests/test_finding_url_witnesses.py",
 "skills/seo-scan/tests/test_plan_crawl_page_owners.py",
 "skills/seo-scan/tests/test_crawl_rule_handoff.py",
 "skills/seo-scan/tests/test_plan_astro_page_routes.py",
 "skills/seo-scan/tests/test_plan_nuxt_page_routes.py",
 "skills/seo-scan/tests/test_plan_hugo_page_routes.py",
 "skills/seo-scan/tests/test_plan_route_priority.py",
 "skills/seo-scan/tests/test_plan_html_file_routes.py",
