# Opt-in structured-data receipt boundary; pass explicit function targets.
[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/lib/report.py"]
also_copy = ["skills/seo-scan/tests/"]
pytest_add_cli_args_test_selection = [
  "skills/seo-scan/tests/test_schema_receipt_validation.py",
  "skills/seo-scan/tests/test_schema_coverage.py",
  "skills/seo-scan/tests/test_page_schema_review.py",
  "skills/seo-scan/tests/test_scope_selection_consistency.py",
]
[tool.pytest.ini_options]
pythonpath = ["skills/seo-scan/tests"]
